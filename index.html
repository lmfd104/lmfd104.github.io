<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lmfd104 — apps</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #241c2a; color: #eee; }
    .card { text-align: center; padding: 2rem; }
    h1 { margin: 0 0 .25rem; color: #f5c33b; }
    a { color: #b07cff; }
    #auth-box { background:#1a2a1a; border:2px solid #4caf50; border-radius:8px;
      padding:1.5rem; margin-bottom:2rem; max-width:600px; word-break:break-all; text-align:left; }
    #auth-box h2 { color:#4caf50; margin-top:0; }
    #auth-code { font-family:monospace; font-size:1em; color:#fff; background:#0d1a0d;
      padding:.5rem; border-radius:4px; display:block; margin:.5rem 0; }
    #copy-btn { padding:.4rem 1.2rem; background:#4caf50; color:#fff;
      border:none; border-radius:4px; cursor:pointer; font-size:1em; }
  </style>
</head>
<body>
  <script>
    (function() {
      var p = new URLSearchParams(window.location.search);
      var code = p.get("code");
      if (!code) return;
      var safe = code.replace(/[<>&"]/g, function(c){
        return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];
      });
      var box = document.createElement("div");
      box.id = "auth-box";
      box.innerHTML = "<h2>TikTok Auth Code<\/h2>"
        + "<p>Copy this and paste it into the terminal:<\/p>"
        + "<code id='auth-code'>" + safe + "<\/code>"
        + "<button id='copy-btn' onclick='navigator.clipboard.writeText(this.previousSibling.textContent);this.textContent=\"Copied!\"'>Copy Code<\/button>";
      document.body.prepend(box);
    })();
  </script>
  <div class="card">
    <h1>Aftershock</h1>
    <p>A block puzzle with momentum.</p>
    <p><a href="/app-ads.txt">app-ads.txt</a></p>
    <p><a href="/suno-api.html">Suno API docs</a></p>
  </div>
</body>
</html>
