<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Game — Tallyside</title>
<!--
  Parent-facing public game page for Tallyside (com.flagstatspro, MiamiJambo).

  Lives here rather than in the edge function because Supabase rewrites text/html GET
  responses on *.supabase.co to text/plain + a sandbox CSP, which silently broke every
  shared link. Same reason the RSVP page next door is served from Pages.

  This file is deliberately dumb: the `game-page` function returns presentation-ready
  strings and everything below assigns them with textContent. No innerHTML anywhere, so a
  player named `<script>` renders as text by construction rather than by remembering to
  escape it.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5f6672;
    --line: #e3e6ea; --accent: #3b82f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --card: #1a1d23; --text: #eef0f3; --muted: #9aa2ad; --line: #2a2e36; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; padding: 16px; max-width: 560px; margin: 0 auto;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .status { text-align: center; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e0443e; margin-right: 6px; vertical-align: 1px; }
  .scoreline { display: flex; justify-content: space-evenly; align-items: center; text-align: center; }
  .team-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  .score { font-size: 52px; font-weight: 800; line-height: 1.1; }
  .home .score { color: var(--accent); }
  .dash { font-size: 26px; color: var(--muted); padding: 0 8px; }
  .winner { text-align: center; font-size: 20px; font-weight: 700; margin-top: 10px; }
  h2 { font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .recap { font-style: italic; }
  .perf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .perf:last-child { border-bottom: none; }
  .perf .who { font-weight: 600; overflow-wrap: anywhere; }
  .perf .line { font-size: 13px; color: var(--muted); }
  .perf .pts { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .play { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .play:last-child { border-bottom: none; }
  .play .q { color: var(--muted); min-width: 30px; font-weight: 600; }
  .play .side { color: var(--muted); overflow-wrap: anywhere; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 24px; }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; }
  .cta { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
         font-weight: 700; padding: 14px; border-radius: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="root"><div class="card"><p class="empty">Loading game…</p></div></div>

<script>
(function () {
  "use strict";

  var API = "https://vuvjgucbknkxeexvcpoo.supabase.co/functions/v1/game-page";
  var STORE = "https://play.google.com/store/apps/details?id=com.flagstatspro";
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var root = document.getElementById("root");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function card(children) {
    var c = el("div", "card");
    children.forEach(function (ch) { if (ch) c.appendChild(ch); });
    return c;
  }

  function storeFooter() {
    var f = el("footer");
    f.appendChild(document.createTextNode("🏈 Scored with "));
    var a = el("a", null, "Tallyside");
    a.href = STORE;
    f.appendChild(a);
    return f;
  }

  function showMessage(heading, detail) {
    root.textContent = "";
    var c = card([el("h2", null, heading), el("p", "empty", detail)]);
    c.style.textAlign = "center";
    root.appendChild(c);
    root.appendChild(storeFooter());
  }

  function statusNode(g) {
    var s = el("div", "status");
    if (g.status === "FINAL") {
      s.textContent = "Final";
    } else if (g.status === "IN_PROGRESS") {
      s.appendChild(el("span", "live-dot"));
      s.appendChild(document.createTextNode("In progress · " + g.periodLabel));
    } else {
      // Kickoff is epoch millis; render in the VIEWER's timezone, not the coach's.
      var when = "";
      if (Number.isFinite(g.scheduledAt) && g.scheduledAt > 0) {
        when = new Date(g.scheduledAt).toLocaleString([], {
          weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
        });
      }
      s.textContent = when ? "Scheduled · Kickoff " + when : "Scheduled";
    }
    return s;
  }

  function scoreNode(g) {
    var scheduled = g.status === "SCHEDULED";
    var wrap = el("div", "scoreline");

    var homeBox = el("div", "home");
    homeBox.appendChild(el("div", "team-name", g.home));
    homeBox.appendChild(el("div", "score", scheduled ? "–" : g.homeScore));

    var awayBox = el("div");
    awayBox.appendChild(el("div", "team-name", g.away));
    awayBox.appendChild(el("div", "score", scheduled ? "–" : g.awayScore));

    wrap.appendChild(homeBox);
    wrap.appendChild(el("div", "dash", scheduled ? "vs" : "–"));
    wrap.appendChild(awayBox);
    return wrap;
  }

  function listCard(title, rows) {
    if (!rows.length) return null;
    var c = el("div", "card");
    c.appendChild(el("h2", null, title));
    rows.forEach(function (r) { c.appendChild(r); });
    return c;
  }

  function render(g) {
    root.textContent = "";

    var head = card([statusNode(g), scoreNode(g), g.winner ? el("div", "winner", g.winner) : null]);
    head.style.setProperty("--accent", g.teamColor);
    root.appendChild(head);

    if (g.recap) {
      root.appendChild(card([el("h2", null, "Game recap"), el("p", "recap", g.recap)]));
    }

    var medals = ["🥇", "🥈", "🥉"];
    var perf = listCard("Top performers", (g.performers || []).map(function (p, i) {
      var row = el("div", "perf");
      var left = el("div");
      left.appendChild(el("div", "who", (medals[i] ? medals[i] + " " : "") + p.name));
      left.appendChild(el("div", "line", p.statLine));
      row.appendChild(left);
      row.appendChild(el("div", "pts", p.points + " pts"));
      return row;
    }));
    if (perf) root.appendChild(perf);

    var plays = listCard("Play by play", (g.plays || []).map(function (p) {
      var row = el("div", "play");
      row.appendChild(el("span", "q", "Q" + p.period));
      row.appendChild(el("span", null, p.label));
      row.appendChild(el("span", "side", "— " + p.who));
      return row;
    }));
    if (plays) root.appendChild(plays);

    var cta = el("a", "cta", "Get Tallyside free");
    cta.href = STORE;
    root.appendChild(cta);
    root.appendChild(storeFooter());

    document.title = g.home + " vs " + g.away + " — Tallyside";
  }

  var gameId = new URLSearchParams(location.search).get("g") || "";
  if (!UUID_RE.test(gameId)) {
    showMessage("Game not found", "This link is missing its game id. Ask the coach to share it again.");
    return;
  }

  function load(onDone) {
    fetch(API + "?g=" + encodeURIComponent(gameId) + "&format=json", { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      })
      .then(function (g) {
        if (!g) {
          showMessage("Game not found", "This game link is no longer available. It may have been deleted by the coach.");
          return;
        }
        render(g);
        if (onDone) onDone(g);
      })
      .catch(function () {
        showMessage("Couldn't load this game", "Check your connection and try again.");
      });
  }

  // A game in progress updates as the coach scores. Poll rather than meta-refresh so the
  // page doesn't flash, and stop once it's FINAL so a link left open isn't polling forever.
  load(function (g) {
    if (g.status !== "IN_PROGRESS") return;
    var timer = setInterval(function () {
      load(function (next) { if (next.status !== "IN_PROGRESS") clearInterval(timer); });
    }, 45000);
  });
})();
</script>
</body>
</html>
