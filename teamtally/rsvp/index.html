<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RSVP — Tallyside</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5f6672;
    --line: #e3e6ea; --accent: #3b82f6; --going: #1a9d55; --maybe: #c88a1a; --out: #d04b44;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --card: #1a1d23; --text: #eef0f3; --muted: #9aa2ad; --line: #2a2e36; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; padding: 16px; max-width: 560px; margin: 0 auto;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; overflow-wrap: anywhere; }
  .when, .loc { color: var(--muted); font-size: 14px; }
  h2 { font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .player { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 12px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text);
    font-size: 16px; text-align: left; cursor: pointer; border-radius: 8px; }
  .player:last-child { border-bottom: none; }
  .player.sel { background: rgba(59, 130, 246, .14); font-weight: 600; }
  .chip { font-size: 12px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  .chip.GOING { color: var(--going); } .chip.MAYBE { color: var(--maybe); } .chip.OUT { color: var(--out); }
  .statuses { display: flex; gap: 10px; margin-top: 14px; }
  .status-btn { flex: 1; padding: 13px 0; font-size: 16px; font-weight: 700; border-radius: 10px;
    border: 1.5px solid var(--line); background: none; color: var(--text); cursor: pointer; }
  .status-btn[data-s="GOING"].sel { background: var(--going); border-color: var(--going); color: #fff; }
  .status-btn[data-s="MAYBE"].sel { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .status-btn[data-s="OUT"].sel   { background: var(--out);   border-color: var(--out);   color: #fff; }
  .status-btn:disabled { opacity: .5; cursor: default; }
  #msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
  #msg.ok { color: var(--going); font-weight: 600; }
  #msg.err { color: var(--out); font-weight: 600; }
  .center { text-align: center; color: var(--muted); font-size: 15px; padding: 8px 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 24px; }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .spinner { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div id="app"><div class="card"><div class="spinner">Loading invite…</div></div></div>
<footer id="footer">Powered by <a href="https://play.google.com/store/apps/details?id=com.flagstatspro">Tallyside</a>
  <span id="openapp" hidden> · <a href="#">Open in the app</a></span></footer>
<script>
(function () {
  "use strict";
  var API = "https://vuvjgucbknkxeexvcpoo.supabase.co/functions/v1/event-rsvp";
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var STATUSES = ["GOING", "MAYBE", "OUT"];
  var app = document.getElementById("app");
  var token = new URLSearchParams(window.location.search).get("e") || "";

  // All user-originated strings (names, titles, locations) go through textContent —
  // nothing user-controlled is ever assigned to innerHTML.
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function whenText(ms) {
    return new Date(ms).toLocaleString([], {
      weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  }

  function showUnavailable() {
    app.textContent = "";
    var card = el("div", "card");
    card.appendChild(el("h2", null, "Invite not available"));
    card.appendChild(el("p", "center", "This invite link is no longer valid. Ask your coach for a new one."));
    app.appendChild(card);
  }

  function render(ctx) {
    app.textContent = "";

    var head = el("div", "card");
    head.appendChild(el("h2", null, (ctx.eventType === "GAME" ? "Game" : "Practice") + " invite"));
    head.appendChild(el("h1", null, ctx.title));
    head.appendChild(el("div", "when", "🗓 " + whenText(ctx.scheduledAt)));
    if (ctx.location) head.appendChild(el("div", "loc", "📍 " + ctx.location));
    app.appendChild(head);

    if (!ctx.rsvpOpen) {
      var closed = el("div", "card");
      closed.appendChild(el("div", "center",
        "RSVP is closed — this " + (ctx.eventType === "GAME" ? "game" : "practice") + " has already started."));
      app.appendChild(closed);
      return;
    }

    var card = el("div", "card");
    card.appendChild(el("h2", null, "Who are you responding for?"));

    var selPid = null;
    var playerBtns = [];
    var existing = ctx.existing || {};

    var statuses = el("div", "statuses");
    statuses.hidden = true;
    var msg = el("div");
    msg.id = "msg";
    var statusBtns = STATUSES.map(function (s) {
      var b = el("button", "status-btn", s === "GOING" ? "Going" : s === "MAYBE" ? "Maybe" : "Out");
      b.setAttribute("data-s", s);
      b.addEventListener("click", function () { submit(s); });
      statuses.appendChild(b);
      return b;
    });

    function markStatus(s) {
      statusBtns.forEach(function (b) { b.classList.toggle("sel", b.getAttribute("data-s") === s); });
    }

    function setChip(btn, status) {
      var chip = btn.querySelector(".chip");
      if (!chip) { chip = el("span", "chip"); btn.appendChild(chip); }
      chip.className = "chip " + status;
      chip.textContent = status;
    }

    (ctx.roster || []).forEach(function (p) {
      var b = el("button", "player");
      b.appendChild(el("span", null, p.displayName));
      var st = existing[p.playerId];
      if (STATUSES.indexOf(st) >= 0) setChip(b, st);
      b.addEventListener("click", function () {
        selPid = p.playerId;
        playerBtns.forEach(function (q) { q.classList.toggle("sel", q === b); });
        statuses.hidden = false;
        markStatus(existing[p.playerId] || "");
        msg.textContent = ""; msg.className = "";
      });
      playerBtns.push(b);
      card.appendChild(b);
    });
    if (!ctx.roster || ctx.roster.length === 0) {
      card.appendChild(el("p", "center", "No players on the roster yet."));
    }

    function submit(status) {
      if (!selPid) return;
      statusBtns.forEach(function (b) { b.disabled = true; });
      msg.textContent = "Saving…"; msg.className = "";
      fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: token, playerId: selPid, status: status }),
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        statusBtns.forEach(function (b) { b.disabled = false; });
        if (res.ok) {
          existing[selPid] = status;
          markStatus(status);
          var sel = playerBtns.filter(function (b) { return b.classList.contains("sel"); })[0];
          if (sel) setChip(sel, status);
          msg.textContent = "Saved — thanks for responding!"; msg.className = "ok";
        } else {
          msg.textContent = res.j && res.j.error === "rsvp_closed"
            ? "RSVP just closed for this event."
            : "Couldn’t save. Please try again.";
          msg.className = "err";
        }
      }).catch(function () {
        statusBtns.forEach(function (b) { b.disabled = false; });
        msg.textContent = "Network error. Please try again."; msg.className = "err";
      });
    }

    card.appendChild(statuses);
    card.appendChild(msg);
    card.appendChild(el("p", "hint",
      "Tap your player, then tap a response. You can change it any time before the event starts."));
    app.appendChild(card);
  }

  if (!UUID_RE.test(token)) { showUnavailable(); return; }
  // Installed users can hop into the native RSVP screen (teamtally:// deep link).
  var openApp = document.getElementById("openapp");
  if (openApp) {
    openApp.querySelector("a").setAttribute("href", "teamtally://rsvp/" + encodeURIComponent(token));
    openApp.hidden = false;
  }
  fetch(API + "?e=" + encodeURIComponent(token))
    .then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      if (String(e.message).indexOf("http 404") >= 0) { showUnavailable(); return; }
      app.textContent = "";
      var card = el("div", "card");
      card.appendChild(el("p", "center", "Couldn’t load this invite. Check your connection and try again."));
      app.appendChild(card);
    });
})();
</script>
</body>
</html>
