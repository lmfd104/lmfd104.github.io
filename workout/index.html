<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>12-Week Training</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #15181d; --muted: #606874; --line: #dfe2e7;
    --accent: #e8590c; --accent-ink: #ffffff; --good: #2b8a3e; --soft: #fff1e8; --input: #fafbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1b1f25; --ink: #eef0f3; --muted: #9aa3ae; --line: #2c323a;
      --accent: #ff7a2e; --accent-ink: #111418; --good: #51cf66; --soft: #2a1d14; --input: #14171c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --card: #1b1f25; --ink: #eef0f3; --muted: #9aa3ae; --line: #2c323a;
    --accent: #ff7a2e; --accent-ink: #111418; --good: #51cf66; --soft: #2a1d14; --input: #14171c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  header .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 20px; margin: 0 0 2px; }
  h3 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .muted { color: var(--muted); font-size: 14px; }
  .datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .datebar .label { flex: 1; text-align: center; font-weight: 600; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 42px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.small { padding: 4px 10px; min-height: 34px; font-size: 14px; }
  button:disabled { opacity: .5; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--input); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; width: 100%; min-height: 40px; }
  textarea { min-height: 70px; resize: vertical; }
  .ex { border-top: 1px solid var(--line); padding: 10px 0; }
  .ex:first-of-type { border-top: 0; }
  .ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ex-name { font-weight: 650; }
  .presc { color: var(--accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .last { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; margin-top: 8px; }
  .set { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 4px; align-items: center; }
  .set span { font-size: 12px; color: var(--muted); text-align: center; }
  .set input { padding: 6px; min-height: 36px; text-align: center; }
  .rounds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chk { min-width: 44px; min-height: 40px; border-radius: 8px; font-weight: 600; }
  .chk.on { background: var(--good); border-color: var(--good); color: #fff; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 8px 2px; font-size: 12px; color: var(--muted); min-height: 60px; }
  .tabs button b { display: block; font-size: 20px; line-height: 1.1; }
  .tabs button.active { color: var(--accent); font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  label.f { display: block; font-size: 13px; color: var(--muted); }
  label.f input, label.f select { margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { text-align: center; padding: 6px 2px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; cursor: pointer; background: var(--card); }
  .day.done { background: var(--good); border-color: var(--good); color: #fff; }
  .day.today { outline: 2px solid var(--accent); }
  .timer-display { font-size: 72px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .timer-sub { text-align: center; font-size: 18px; font-weight: 600; min-height: 28px; }
  .timer-sub.work { color: var(--accent); } .timer-sub.rest { color: var(--good); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
  .seg button { padding: 8px 2px; font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .btnrow > * { flex: 1; }
  .banner { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 420px) { .timer-display { font-size: 60px; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>12-Week Training</h1>
    <span class="pill" id="phasePill"></span>
  </div>
</header>

<main>
  <!-- TODAY -->
  <section id="view-today">
    <div class="datebar">
      <button class="small" id="prevDay" aria-label="Previous day">◀</button>
      <div class="label" id="dateLabel"></div>
      <button class="small" id="nextDay" aria-label="Next day">▶</button>
    </div>
    <div id="todayBody"></div>
  </section>

  <!-- PLAN -->
  <section id="view-plan" class="hidden"></section>

  <!-- TIMER -->
  <section id="view-timer" class="hidden">
    <div class="card">
      <div class="seg" id="timerModes">
        <button data-mode="emom" class="on">EMOM</button>
        <button data-mode="intervals">Intervals</button>
        <button data-mode="amrap">AMRAP</button>
        <button data-mode="stopwatch">Clock</button>
      </div>
      <div id="timerConfig"></div>
      <div class="timer-sub" id="timerSub">Ready</div>
      <div class="timer-display" id="timerDisplay">0:00</div>
      <div class="timer-sub muted" id="timerRound"></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="primary" id="timerStart">Start</button>
        <button id="timerReset">Reset</button>
      </div>
      <p class="muted" style="margin-bottom:0">Beeps 3-2-1 before each switch. The screen stays awake while the timer runs (on supported browsers).</p>
    </div>
  </section>

  <!-- PROGRESS -->
  <section id="view-progress" class="hidden"></section>

  <!-- SETTINGS -->
  <section id="view-settings" class="hidden"></section>
</main>

<nav class="tabs">
  <button data-view="today" class="active"><b>●</b>Today</button>
  <button data-view="plan"><b>▦</b>Plan</button>
  <button data-view="timer"><b>◷</b>Timer</button>
  <button data-view="progress"><b>↗</b>Progress</button>
  <button data-view="settings"><b>⚙</b>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ---------- Storage ---------- */
const KEY = 'twelveWeekTraining.v1';
const defaultData = () => ({
  settings: { start: nextMonday(new Date()), squat: 200, bench: 180, deadlift: 225, theme: 'auto' },
  logs: {},       // { 'YYYY-MM-DD': { ex: {id: {sets:[{w,r}], rounds:[bool], score:''}}, notes:'', done:false } }
  weighins: [],   // [{date, weight, waist}]
  tests: {}       // { start: {row2k, pushups, weight, waist}, end: {...} }
});
let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || defaultData(); } catch (e) { data = defaultData(); }
data.settings = Object.assign(defaultData().settings, data.settings || {});
data.logs = data.logs || {}; data.weighins = data.weighins || []; data.tests = data.tests || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('Could not save (storage blocked)'); } }

/* ---------- Date helpers ---------- */
function iso(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function nextMonday(d) { const x = new Date(d); const dow = x.getDay(); const add = dow === 1 ? 0 : (8 - dow) % 7; x.setDate(x.getDate() + add); return iso(x); }
function fmtDate(s) { return parse(s).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }); }
function fmtShort(s) { return parse(s).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }); }
const todayISO = () => iso(new Date());

function weekOf(s) {
  const diff = Math.floor((parse(s) - parse(data.settings.start)) / 864e5);
  return Math.floor(diff / 7) + 1; // may be <1 or >12
}
function ctx(s) {
  const raw = weekOf(s);
  const week = Math.min(12, Math.max(1, raw));
  const phase = week <= 4 ? 1 : week <= 8 ? 2 : 3;
  const deload = week === 4 || week === 8;
  return { raw, week, phase, deload, dow: parse(s).getDay() };
}

/* ---------- Program ---------- */
const PCT = { 1: 0.73, 2: 0.83, 3: 0.92 };
const SCHEME = { 1: [4, 8], 2: [5, 5], 3: [5, 3] };
const r5 = n => Math.round(n / 5) * 5;
function mainLift(c, base) {
  let [sets, reps] = SCHEME[c.phase];
  let w = r5(base * PCT[c.phase]);
  if (c.deload) { sets = Math.max(2, Math.round(sets * 2 / 3)); w = r5(w * 0.9); }
  return { sets, reps, w };
}
const dl = (c, n) => c.deload ? Math.max(1, Math.round(n * 2 / 3)) : n;

function intervals(c) {
  if (c.phase === 1) return { name: 'Rower intervals', presc: `${dl(c,10)} × (1:00 hard / 1:00 easy)`, rounds: dl(c,10), note: 'Hard = 145–160 bpm, only a few words possible.' };
  if (c.phase === 2) return { name: 'Rower intervals', presc: `${dl(c,8)} × (1:30 hard / 1:00 easy)`, rounds: dl(c,8), note: 'Hold the same split (pace) on every hard round.' };
  return { name: 'Assault bike sprints', presc: `${dl(c,14)} × (0:30 all-out / 0:45 easy)`, rounds: dl(c,14), note: 'All-out means all-out. Log your calories per sprint in notes.' };
}

// Build the workout for a date. Exercise types: lift (weight+reps per set), rounds (checkbox per round), score (free text)
function workoutFor(s) {
  const c = ctx(s); const S = data.settings;
  const rest = c.phase === 1 ? '' : c.phase === 2 ? ' (rest −15s)' : ' (rest −30s)';
  const warm = { id: 'warmup', type: 'rounds', name: 'Warm-up', presc: '5 min', rounds: 1, note: '3 min easy row/bike + 10 air squats, 10 arm circles, 5 inchworms, 10 glute bridges' };
  const cool = { id: 'cooldown', type: 'rounds', name: 'Cool-down', presc: '2 min', rounds: 1, note: 'Easy walk + stretch hips, hamstrings, chest' };
  switch (c.dow) {
    case 1: { const m = mainLift(c, S.squat); return { title: 'Lower-Body Strength', c, ex: [warm,
      { id: 'squat', type: 'lift', name: 'Back squat (or hack squat)', presc: `${m.sets}×${m.reps} @ ${m.w} lb`, sets: m.sets, w: m.w, reps: m.reps, note: 'Rest 2 min' + rest },
      { id: 'rdl', type: 'lift', name: 'DB Romanian deadlift', presc: `${dl(c,3)}×10`, sets: dl(c,3), reps: 10, note: 'Superset with walking lunges, rest 60s' },
      { id: 'lunge', type: 'lift', name: 'Walking lunges', presc: `${dl(c,3)}×10/leg`, sets: dl(c,3), reps: 10 },
      { id: 'legpress', type: 'lift', name: 'Leg press', presc: `${dl(c,3)}×12`, sets: dl(c,3), reps: 12, note: 'Rest 60s' },
      { id: 'fin-mon', type: 'rounds', name: 'Finisher: 8-min EMOM', presc: '8 rounds', rounds: 8, note: 'Odd min: 12-cal bike · Even min: 15 KB swings', timer: { mode: 'emom', mins: 8 } },
      cool] }; }
    case 2: { const iv = intervals(c); return { title: 'Intervals + Core', c, ex: [warm,
      { id: 'intervals', type: 'rounds', name: iv.name, presc: iv.presc, rounds: iv.rounds, note: iv.note,
        timer: c.phase === 1 ? { mode: 'intervals', work: 60, rest: 60, rounds: iv.rounds } : c.phase === 2 ? { mode: 'intervals', work: 90, rest: 60, rounds: iv.rounds } : { mode: 'intervals', work: 30, rest: 45, rounds: iv.rounds } },
      { id: 'core-tue', type: 'rounds', name: 'Core circuit', presc: `${dl(c,3)} rounds`, rounds: dl(c,3), note: '45s plank · 12/side cable woodchop · 10/side dead bug' },
      { id: 'iv-score', type: 'score', name: 'Interval result', presc: 'log it', note: 'e.g. avg 500m split, or total calories' },
      cool] }; }
    case 3: { const m = mainLift(c, S.bench); return { title: 'Upper-Body Strength', c, ex: [warm,
      { id: 'bench', type: 'lift', name: 'Bench press', presc: `${m.sets}×${m.reps} @ ${m.w} lb`, sets: m.sets, w: m.w, reps: m.reps, note: 'Rest 2 min' + rest },
      { id: 'incline', type: 'lift', name: 'Incline DB press', presc: `${dl(c,3)}×10`, sets: dl(c,3), reps: 10, note: 'Superset with lat pulldown' },
      { id: 'pulldown', type: 'lift', name: 'Lat pulldown', presc: `${dl(c,3)}×10`, sets: dl(c,3), reps: 10 },
      { id: 'ohp', type: 'lift', name: 'DB shoulder press', presc: `${dl(c,3)}×10`, sets: dl(c,3), reps: 10, note: 'Superset with cable row' },
      { id: 'row', type: 'lift', name: 'Seated cable row', presc: `${dl(c,3)}×12`, sets: dl(c,3), reps: 12 },
      { id: 'curl', type: 'lift', name: 'Curls', presc: `${dl(c,2)}×12`, sets: dl(c,2), reps: 12, note: 'Superset with rope pushdown' },
      { id: 'pushdown', type: 'lift', name: 'Rope pushdown', presc: `${dl(c,2)}×12`, sets: dl(c,2), reps: 12 },
      { id: 'fin-wed', type: 'score', name: 'Finisher: 5-min AMRAP', presc: 'rounds', note: '10 push-ups + 10 sit-ups. Log rounds + reps.', timer: { mode: 'amrap', mins: 5 } },
      cool] }; }
    case 4: { const A = c.week % 2 === 1; return { title: 'Metcon ' + (A ? 'A' : 'B'), c, ex: [warm,
      A ? { id: 'metcon-a', type: 'score', name: 'Metcon A: 20-min AMRAP', presc: c.deload ? '15 min @ 80%' : '20 min', note: '10 KB swings · 10 box step-ups · 10 DB thrusters · 10-cal row. Log rounds + reps.', timer: { mode: 'amrap', mins: c.deload ? 15 : 20 } }
        : { id: 'metcon-b', type: 'score', name: 'Metcon B: For time', presc: c.deload ? '25-min cap @ 80%' : '25-min cap', note: '40-cal bike · 30 goblet squats · 30 push-ups · 20 DB snatches · 10 burpees · 40-cal row. Log your time.', timer: { mode: 'stopwatch' } },
      cool] }; }
    case 5: return { title: 'Hinge + Full Body', c, ex: [warm,
      { id: 'deadlift', type: 'lift', name: 'Deadlift (trap bar or conventional)', presc: `${dl(c,4)}×6 @ ~${c.deload ? r5(S.deadlift * .75) : r5(S.deadlift * (c.phase === 1 ? .82 : c.phase === 2 ? .88 : .93))} lb`, sets: dl(c,4), reps: 6, note: 'Rest 2 min. Update your deadlift working number in Settings as it climbs.' },
      { id: 'bss', type: 'lift', name: 'Bulgarian split squat', presc: `${dl(c,3)}×8/leg`, sets: dl(c,3), reps: 8, note: 'Superset with pull-ups' },
      { id: 'pullup', type: 'lift', name: 'Pull-ups (assisted if needed)', presc: `${dl(c,3)}×6–8`, sets: dl(c,3), reps: 8, note: 'Log assist weight as negative, e.g. -50' },
      { id: 'carry', type: 'lift', name: 'Farmer carry', presc: `${dl(c,4)}×40 m`, sets: dl(c,4), reps: 40, note: 'Heavy DBs per hand. Reps column = meters. Sled push if available.' },
      { id: 'fin-fri', type: 'rounds', name: 'Finisher: 8-min EMOM', presc: '8 rounds', rounds: 8, note: 'Odd min: 8 burpees · Even min: 12-cal bike', timer: { mode: 'emom', mins: 8 } },
      cool] };
    case 6: return { title: 'Engine (Zone 2)', c, ex: [warm,
      { id: 'z2', type: 'rounds', name: 'Zone 2 — 30 min', presc: '3 × 10 min', rounds: 3, note: '10 min row → 10 min bike → 10 min incline treadmill (12%, ~3.0 mph). Conversational pace, ~105–125 bpm.', timer: { mode: 'intervals', work: 600, rest: 0, rounds: 3 } },
      { id: 'core-sat', type: 'rounds', name: 'Core — 5 min', presc: '2 rounds', rounds: 2, note: '30s side plank/side · 15 hanging knee raises · 20 sit-ups' },
      { id: 'z2-score', type: 'score', name: 'Distances', presc: 'log it', note: 'Row meters / bike cal / treadmill miles' },
      cool] };
    default: return { title: 'Active Recovery', c, ex: [
      { id: 'walk', type: 'rounds', name: 'Easy incline walk', presc: '25 min', rounds: 1, note: 'Easy pace. Skip it entirely if you are beat.' },
      { id: 'mobility', type: 'rounds', name: 'Mobility / foam roll', presc: '10 min', rounds: 1, note: 'Hips, T-spine, hamstrings, calves, chest' }] };
  }
}

/* ---------- Log helpers ---------- */
function getLog(s) { return data.logs[s] || { ex: {}, notes: '', done: false }; }
function ensureLog(s) { if (!data.logs[s]) data.logs[s] = { ex: {}, notes: '', done: false }; return data.logs[s]; }
function lastFor(id, before) {
  const dates = Object.keys(data.logs).filter(d => d < before).sort().reverse();
  for (const d of dates) {
    const e = data.logs[d].ex[id];
    if (!e) continue;
    if (e.sets && e.sets.some(x => x.w || x.r)) return { d, text: e.sets.filter(x => x.w || x.r).map(x => (x.w || '–') + '×' + (x.r || '–')).join(', ') };
    if (e.score) return { d, text: e.score };
  }
  return null;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/* ---------- Views ---------- */
let curDate = todayISO();
let view = 'today';

function setPill() {
  const c = ctx(curDate);
  let t = c.raw < 1 ? 'Starts ' + fmtShort(data.settings.start) : c.raw > 12 ? 'Program complete' : `Week ${c.week} · Phase ${c.phase}${c.deload ? ' · Deload' : ''}`;
  document.getElementById('phasePill').textContent = t;
}

function renderToday() {
  setPill();
  document.getElementById('dateLabel').textContent = (curDate === todayISO() ? 'Today · ' : '') + fmtDate(curDate);
  const w = workoutFor(curDate); const log = getLog(curDate); const c = w.c;
  let h = '';
  if (c.raw < 1) h += `<div class="banner">Your program starts <b>${fmtDate(data.settings.start)}</b>. Showing Week 1 for preview. Change the start date in Settings.</div>`;
  if (c.raw === 1 && c.dow === 1 && !data.tests.start) h += `<div class="banner">Week 1: record your baseline tests in <b>Progress</b> (2k row, 2-min push-ups, weight, waist).</div>`;
  if (c.raw === 12 && c.dow === 6 && !data.tests.end) h += `<div class="banner">Final week: record your end tests in <b>Progress</b> and compare.</div>`;
  if (c.deload) h += `<div class="banner"><b>Deload week.</b> Fewer sets, ~10% lighter. Conditioning at ~80% effort. Recover so you can push again.</div>`;
  h += `<div class="card"><h2>${esc(w.title)}</h2><div class="muted">Week ${c.week} · Phase ${c.phase} · 40 min</div>`;
  for (const e of w.ex) {
    const le = log.ex[e.id] || {};
    const last = lastFor(e.id, curDate);
    h += `<div class="ex"><div class="ex-head"><div class="ex-name">${esc(e.name)}</div><div class="presc">${esc(e.presc)}</div></div>`;
    if (e.note) h += `<div class="note">${esc(e.note)}</div>`;
    if (e.type === 'lift') {
      h += `<div class="sets">`;
      for (let i = 0; i < e.sets; i++) {
        const s = (le.sets || [])[i] || {};
        h += `<div class="set"><span>${i + 1}</span><input inputmode="decimal" placeholder="${e.w ? e.w : 'lb'}" data-ex="${e.id}" data-i="${i}" data-k="w" value="${esc(s.w)}" aria-label="Set ${i + 1} weight"><input inputmode="numeric" placeholder="${e.reps}" data-ex="${e.id}" data-i="${i}" data-k="r" value="${esc(s.r)}" aria-label="Set ${i + 1} reps"></div>`;
      }

function lineChart(points, unit) {
  if (points.length < 2) return `<p class="muted">Add at least two entries to see a chart.</p>`;
  const W = 600, H = 200, P = 34;
  const xs = points.map(p => parse(p.d).getTime()), ys = points.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .1; y0 -= pad; y1 += pad;
  const X = x => P + (x - x0) / (x1 - x0 || 1) * (W - P - 10), Y = y => H - 22 - (y - y0) / (y1 - y0) * (H - 34);
  const path = points.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const dots = points.map((p, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="var(--accent)"><title>${fmtShort(p.d)}: ${p.v} ${unit}</title></circle>`).join('');
  const ticks = [y0 + pad, (y0 + y1) / 2, y1 - pad].map(v => `<line x1="${P}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P - 4}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Chart">${ticks}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${P}" y="${H - 4}">${fmtShort(points[0].d)}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${fmtShort(points[points.length - 1].d)}</text></svg>`;
}

function topSet(id) {
  const out = [];

    if (m > -Infinity) out.push({ d, v: m });
  }
  return out;
}

/* ---------- Timer ---------- */
const T = { mode: 'emom', cfg: { emom: { mins: 8 }, intervals: { work: 60, rest: 60, rounds: 10 }, amrap: { mins: 20 }, stopwatch: {} },
  running: false, startAt: 0, elapsed: 0, raf: 0, lastBeep: -1, wake: null };
let actx;
function beep(freq = 880, dur = 0.15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
  if (navigator.vibrate) try { navigator.vibrate(dur > .2 ? 300 : 80); } catch (e) {}
}
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function renderTimerConfig() {
  document.querySelectorAll('#timerModes button').forEach(b => b.classList.toggle('on', b.dataset.mode === T.mode));
  const c = T.cfg[T.mode]; let h = '';
  if (T.mode === 'emom') h = `<div class="grid2"><label class="f">Minutes<input inputmode="numeric" data-cfg="mins" value="${c.mins}"></label><div></div></div>`;
  if (T.mode === 'intervals') h = `<div class="grid3"><label class="f">Work (sec)<input inputmode="numeric" data-cfg="work" value="${c.work}"></label><label class="f">Rest (sec)<input inputmode="numeric" data-cfg="rest" value="${c.rest}"></label><label class="f">Rounds<input inputmode="numeric" data-cfg="rounds" value="${c.rounds}"></label></div>`;
  if (T.mode === 'amrap') h = `<div class="grid2"><label class="f">Minutes<input inputmode="numeric" data-cfg="mins" value="${c.mins}"></label><div></div></div>`;
  if (T.mode === 'stopwatch') h = `<p class="muted" style="margin:0">Counts up. Use it for "for time" workouts.</p>`;
  const el = document.getElementById('timerConfig'); el.innerHTML = h;
  el.querySelectorAll('[data-cfg]').forEach(inp => inp.addEventListener('change', () => { const n = parseInt(inp.value, 10); if (n >= 0) { c[inp.dataset.cfg] = n; resetTimer(); } }));
  resetTimer();
}
function loadTimer(t) { T.mode = t.mode; Object.assign(T.cfg[t.mode], t); renderTimerConfig(); }

function timerState(el) {
  const c = T.cfg[T.mode];
  if (T.mode === 'stopwatch') return { show: el, sub: T.running ? 'GO' : (el ? 'Paused' : 'Ready'), round: '', done: false, edge: null };
  if (T.mode === 'amrap') { const total = c.mins * 60; return { show: total - el, sub: el >= total ? 'TIME!' : 'AMRAP', round: c.mins + ' min', done: el >= total, edge: total - el }; }
  if (T.mode === 'emom') {
    const total = c.mins * 60; const r = Math.min(c.mins, Math.floor(el / 60) + 1);
    return { show: 60 - (el % 60), sub: el >= total ? 'DONE' : (r % 2 ? 'ODD minute' : 'EVEN minute'), round: `Round ${r} / ${c.mins}`, done: el >= total, edge: 60 - (el % 60), cls: 'work' };
  }
  const per = c.work + c.rest; const total = per * c.rounds; const r = Math.min(c.rounds, Math.floor(el / per) + 1); const inR = el % per;
  const work = inR < c.work;
  return { show: work ? c.work - inR : per - inR, sub: el >= total ? 'DONE' : work ? 'WORK' : 'REST', cls: work ? 'work' : 'rest', round: `Round ${r} / ${c.rounds}`, done: el >= total, edge: work ? c.work - inR : per - inR };
}
function tick() {
  const el = T.elapsed + (T.running ? (performance.now() - T.startAt) / 1000 : 0);
  const st = timerState(el);
  document.getElementById('timerDisplay').textContent = mmss(st.show);
  const sub = document.getElementById('timerSub'); sub.textContent = st.sub; sub.className = 'timer-sub ' + (st.cls || '');
  document.getElementById('timerRound').textContent = st.round;
  // short beeps on the last 3 seconds of each segment
  if (T.running && st.edge !== null) {
    const sec = Math.ceil(st.edge), key = Math.floor(el);
    if (key !== T.lastBeep && sec <= 3 && sec >= 1) { beep(660, .12); T.lastBeep = key; }
  }
  if (T.running && st.done) { beep(990, .6); stopTimer(); T.elapsed = el; return; }
  if (T.running) {
    // long beep at each transition
    const prev = timerState(Math.max(0, el - 0.05));
    if (prev.sub !== st.sub || prev.round !== st.round) beep(990, .35);
    T.raf = requestAnimationFrame(tick);
  }
}
async function startTimer() {
  if (T.running) { T.elapsed += (performance.now() - T.startAt) / 1000; T.running = false; cancelAnimationFrame(T.raf); releaseWake(); document.getElementById('timerStart').textContent = 'Resume'; tick(); return; }
  if (timerState(T.elapsed).done) T.elapsed = 0;
  beep(990, .3);
  T.running = true; T.startAt = performance.now(); document.getElementById('timerStart').textContent = 'Pause';
  try { if ('wakeLock' in navigator) T.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  tick();
}
function releaseWake() { try { T.wake && T.wake.release(); } catch (e) {} T.wake = null; }
function stopTimer() { T.running = false; cancelAnimationFrame(T.raf); releaseWake(); document.getElementById('timerStart').textContent = 'Start'; }
function resetTimer() { stopTimer(); T.elapsed = 0; T.lastBeep = -1; tick(); document.getElementById('timerSub').textContent = 'Ready'; }

document.querySelectorAll('#timerModes button').forEach(b => b.addEventListener('click', () => { T.mode = b.dataset.mode; renderTimerConfig(); }));
document.getElementById('timerStart').addEventListener('click', startTimer);
document.getElementById('timerReset').addEventListener('click', resetTimer);
document.addEventListener('visibilitychange', async () => { if (T.running && document.visibilityState === 'visible' && 'wakeLock' in navigator) try { T.wake = await navigator.wakeLock.request('screen'); } catch (e) {} });
